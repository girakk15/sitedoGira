<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gira · Minecraft</title>
  <meta name="description" content="Shaders convertidos pra Rust Edition (Horizon Launcher), grátis. Links do TikTok e YouTube do Gira.">
  <meta property="og:title" content="Gira · Minecraft">
  <meta property="og:description" content="Shaders convertidos pra Rust Edition, grátis pra baixar.">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="img/skin.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <canvas id="particulas" class="particulas" aria-hidden="true"></canvas>

  <main class="wrap">
    <header class="perfil">
      <div class="skin-palco">
        <img id="avatar" class="skin" alt="Skin do Gira no Minecraft" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar-fallback',textContent:'G'}))">
      </div>
      <h1 id="nome"></h1>
      <p id="bio" class="bio"></p>
    </header>

    <section class="bloco" aria-labelledby="t-packs">
      <div class="bloco-topo">
        <h2 id="t-packs">Packs</h2>
        <p class="plataforma" id="plataforma"></p>
      </div>
      <div class="filtros" id="filtros" role="tablist"></div>
      <div class="packs" id="packs"></div>

      <div class="passos">
        <h3>Como instalar</h3>
        <ol id="passos"></ol>
        <p class="nota" id="nota-packs"></p>
      </div>
    </section>

    <section class="bloco" aria-labelledby="t-apoio">
      <h2 id="t-apoio">Apoie o canal</h2>
      <p class="sub">Tudo que faço é de grátis! Se te ajudou de alguma forma, considere apoiar com o que não fizer falta 💜</p>
      <a id="livepix" class="btn btn-neon" target="_blank" rel="noopener">⚡ Mandar um LivePix</a>
    </section>

    <section class="bloco" aria-labelledby="t-redes">
      <h2 id="t-redes">Me segue</h2>
      <p class="sub">Acompanha os vídeos novos por lá.</p>
      <nav class="redes" id="redes" aria-label="Redes sociais"></nav>
    </section>

    <footer>© <span id="ano"></span> Gira · Não afiliado à Mojang/Microsoft</footer>
  </main>

  <dialog id="lightbox" class="lightbox" aria-label="Print em tela cheia">
    <img alt="">
    <button class="lb-btn lb-prev" type="button" aria-label="Print anterior">‹</button>
    <button class="lb-btn lb-next" type="button" aria-label="Próximo print">›</button>
    <button class="lb-fechar" type="button" aria-label="Fechar">✕</button>
    <span class="lb-cont"></span>
  </dialog>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="particulas.js"></script>
</body>
</html>
